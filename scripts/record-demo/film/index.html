<!doctype html>
<!-- The README demo. Everything on screen that moves inside a window is the real recording
     (assets/, made by ../render.sh from record.sh's footage): the input menu switched to
     Araso once, then three mixed-language lines typed with no further switch. The film adds
     the keys that were pressed and which language each word came out in. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=900" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/keys.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 900px; overflow: hidden; background: #0b0b0d; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0d;
        font-family: system-ui, -apple-system, sans-serif; color: #f5f5f7;
      }

      /* Scene 1: the menu bar around the input menu, and the menu it opens. */
      #menu-group {
        position: absolute; left: 295px; top: 90px; width: 680px; height: 600px;
        transform-origin: 0 0;
      }
      .menu-layer { position: absolute; inset: 0; }
      .menu-layer video { position: absolute; left: 0; top: 0; width: 680px; height: 600px; }
      #menu-strip { clip-path: inset(0 0 526px 0 round 18px); }
      #menu-drop { clip-path: inset(86px 128px 44px 115px round 24px); opacity: 0; }
      #menu-ring {
        position: absolute; left: 118px; top: 7px; width: 100px; height: 62px; border-radius: 30px;
        border: 3px solid #64d2ff; opacity: 0;
      }

      /* Scene 2: the page, with the keys below it. */
      #page-card {
        position: absolute; left: 160px; top: 68px; width: 1120px; height: 625px;
        border-radius: 22px; overflow: hidden; background: #161618;
        box-shadow: 0 0 0 1px #2c2c30, 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      #page-video { position: absolute; left: 0; top: 0; width: 1120px; height: 625px; }


      #keys {
        position: absolute; left: 0; top: 712px; width: 1440px; height: 140px; overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent 40px, #000 150px, #000 1290px, transparent 1400px);
        mask-image: linear-gradient(90deg, transparent 40px, #000 150px, #000 1290px, transparent 1400px);
      }
      #track { position: absolute; left: 0; top: 0; height: 140px; }
      .key {
        position: absolute; top: 0; height: 64px; border-radius: 12px; display: grid;
        place-items: center; font: 500 30px/1 system-ui, sans-serif; color: #e5e5ea;
        background: #232327; box-shadow: inset 0 -3px 0 #18181b, 0 0 0 1px #34343a; opacity: 0;
      }
      .tag {
        position: absolute; top: 76px; height: 44px; padding: 0 16px; border-radius: 22px;
        display: grid; place-items: center; font: 600 26px/1 system-ui, sans-serif; opacity: 0;
        white-space: nowrap;
      }
      .tag.en { color: #64d2ff; background: rgba(100, 210, 255, 0.14); }
      .tag.ko { color: #30d158; background: rgba(48, 209, 88, 0.14); }
      .tag.ja { color: #ff6482; background: rgba(255, 100, 130, 0.14); }
      .tag.mix { color: #f5f5f7; background: rgba(245, 245, 247, 0.1); }

      /* Close: the logo and the tagline from the README. */
      #lockup {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 26px;
      }
      #logo { width: 200px; height: 160px; display: block; }
      #wordmark { font: 700 64px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
      #tagline { font: 500 30px/1.2 system-ui, sans-serif; color: #a1a1a6; }
    </style>
  </head>

        <div id="wordmark">Araso</div>
        <div id="tagline">흐름대로 써진다 · 流れるままに · Type as it flows</div>

    <script>
      // Film time = page clip time + PAGE (the page clip starts at 6.2 s).
      const PAGE = 6.2;
      const keys = window.DEMO_KEYS;
      // What each word came out as, in order (the words are the runs of letters in keys.js).
      const languages = ["en", "en", "en", "en+ko", "ko", "ko", "ja", "ko", "ko", "ko", "en", "en+ja"];
      const labels = { en: "EN", ko: "한", ja: "あ", "en+ko": "EN + 한", "en+ja": "EN + あ" };

      // Lay out a keycap per key and a tag under each word.
      const track = document.getElementById("track");
      const caps = [], tags = [];
      let x = 0, word = null, words = 0;
      const glyph = { " ": "", "⏎": "⏎" };
      keys.forEach((key, i) => {
        const letter = /[A-Za-z]/.test(key.k);
        const width = key.k === " " ? 140 : key.k === "⏎" ? 88 : 54;
        const el = document.createElement("div");
        el.className = "key";
        el.textContent = key.k in glyph ? glyph[key.k] : key.k;
        el.style.left = x + "px";
        el.style.width = width + "px";
        track.appendChild(el);
        caps.push({ el, x, width, t: key.t });
        if (letter && !word) word = {};
        if (!letter && word) {
          const lang = languages[words++];
          const tag = document.createElement("div");
          tag.className = "tag " + (lang.includes("+") ? "mix" : lang);
          tag.textContent = labels[lang];
          tag.style.left = x - 6 + "px"; // right edge at the word's last letter
          track.appendChild(tag);
          tags.push({ el: tag, t: key.t });
          word = null;
        }
        x += width + 6;
      });

      // Keys fill the strip from LEFT; when one would pass RIGHT, the strip slides in one move to
      // put it at MID (few moving frames, which keeps the GIF small).
      const LEFT = 160, RIGHT = 1280, MID = 400, SLIDE = 0.2;
      const slides = [];
      let offset = LEFT;
      for (const cap of caps) {
        if (cap.x + cap.width + offset > RIGHT) {
          const to = MID - (cap.x + cap.width);
          slides.push({ t: cap.t - 0.02, from: offset, to });
          offset = to;
        }
      }
      function render(t) {
        let pos = LEFT;
        for (const slide of slides) {
          if (slide.t > t) break;
          const p = Math.min(1, (t - slide.t) / SLIDE);
          pos = slide.from + (slide.to - slide.from) * (1 - Math.pow(1 - p, 3));
        }
        track.style.transform = `translateX(${pos}px)`;
        // A key shows up the moment it's pressed (each change costs GIF bytes, so nothing more).
        for (const cap of caps) cap.el.style.opacity = t >= cap.t ? 1 : 0;
        for (const tag of tags) {
          const p = Math.min(1, Math.max(0, (t - tag.t - 0.05) / 0.2));
          const e = 1 - Math.pow(1 - p, 3);
          tag.el.style.opacity = e;
          tag.el.style.transform = "translateX(-100%)";
        }
      }

      gsap.set(["#page-card", "#keys"], { opacity: 0 });
      const tl = gsap.timeline({ paused: true });

      // Scene 1: the menu bar, a ring on the input menu, the menu (shown while it's open in the
      // footage: 2.67–4.7 s of the clip, which starts at 0.3 s).
      tl.fromTo("#menu-group", { opacity: 0, y: 24, scale: 1.25 }, { opacity: 1, y: 0, scale: 1.25, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#menu-ring", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 1.0);
      tl.to("#menu-ring", { opacity: 0, duration: 0.3 }, 2.7);
      tl.set("#menu-drop", { opacity: 1 }, 2.97);
      tl.to("#menu-drop", { opacity: 0, duration: 0.1 }, 4.95);
      tl.fromTo("#menu-ring", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 5.15);
      // The menu bar steps back as the page comes up.
      tl.to("#menu-ring", { opacity: 0, duration: 0.3 }, 5.6);
      tl.to("#menu-group", { opacity: 0, y: -30, duration: 0.45, ease: "power2.in" }, 5.75);

      // Scene 2.
      tl.fromTo("#keys", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
      tl.fromTo("#page-card", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 6.2);
      const driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, { t: 33.5 - PAGE, duration: 33.5 - PAGE, ease: "none", onUpdate: () => render(driver.t) }, PAGE);
      render(0);

      // Close.
      tl.to(["#page-card", "#keys"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 29.2);
      tl.fromTo("#lockup", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 29.6);
      tl.fromTo("#logo", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 29.6);
      tl.fromTo("#wordmark", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 29.85);
      tl.fromTo("#tagline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 30.05);
      // The logo's glyph: A → 아 → あ → the seamed A, as in the README's logo.
      const glyphs = ["#logo-a", "#logo-ah", "#logo-a-kana", "#logo-seam"];
      gsap.set(glyphs.slice(1), { opacity: 0 });
      glyphs.slice(1).forEach((g, i) => {
        const at = 30.3 + i * 0.55;
        tl.to(glyphs[i], { opacity: 0, duration: 0.2, ease: "sine.inOut" }, at);
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.inOut" }, at + 0.1);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
