<!doctype html>
<!-- The page demo.swift types into (in Safari): one text area, in the film's colours and type,
     dark like the candidate window in dark mode.
     No spell check, autocorrection or writing suggestions, so only Araso marks the text. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Araso</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161618; }
  textarea {
    box-sizing: border-box; width: 100%; height: 100%; margin: 0; padding: 44px 56px;
    border: 0; outline: 0; resize: none; overflow: hidden; background: transparent;
    font: 500 34px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.01em;
    color: #f5f5f7; caret-color: #0a84ff;
  }
</style>
</head>
<body>
<textarea autofocus spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"
          writingsuggestions="false"></textarea>
</body>
</html>
